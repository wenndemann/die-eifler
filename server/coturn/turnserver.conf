# coturn als Notfall-Relais für Die Eifeler (Drehbuch 8.3, ROADMAP M6). Nur nötig, wenn zwei Browser sich nicht direkt erreichen
# (Firmen- oder Handynetz). Zugangsdaten vergibt der Vermittlungs-Server (server/vermittlung.mjs) für jeden Spieler neu und
# kurzlebig; dafür teilen sich beide das Geheimnis unten (dort als TURN_SECRET).
#
# Start (Debian/Ubuntu: apt install coturn):  turnserver -c server/coturn/turnserver.conf
# Vermittlung dazu:  TURN_URLS=turn:turn.example.de:3478,turns:turn.example.de:5349 TURN_SECRET=<geheim> npm run vermittlung

listening-port=3478
tls-listening-port=5349
# Port-Bereich für weitergeleitete Verbindungen (in der Firewall freigeben, UDP und TCP)
min-port=49160
max-port=49200

realm=turn.example.de
# Geheimnis wie TURN_SECRET beim Vermittlungs-Server (z. B. openssl rand -hex 32)
use-auth-secret
static-auth-secret=HIER-DAS-GEHEIMNIS

# TLS (für turns:, hilft in Netzen, die nur 443/TLS durchlassen); Zertifikat z. B. von Let's Encrypt
cert=/etc/letsencrypt/live/turn.example.de/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.de/privkey.pem

# Nur weiterleiten, kein offenes Relais ins eigene Netz
fingerprint
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Grenzen: ein Spiel braucht wenig (nur Befehle), der Stand beim Wiederbeitritt ist einmalig ~0,5 MB
user-quota=12
total-quota=1200
max-bps=200000
no-cli
